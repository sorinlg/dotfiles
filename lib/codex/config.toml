# Codex Desktop / CLI configuration managed by dotfiles.
#
# ONE-TIME SEED for ~/.codex/config.toml: install.sh copies it into place only
# when the user file is missing. Codex Desktop owns the file afterwards and
# rewrites it in place, so it is NOT symlinked and editing this file does not
# change a machine that already has a user config. Only portable appearance
# settings live here; machine-specific plugin, marketplace and trust entries are
# generated by the app itself.

# Homebrew's font-meslo-lg-nerd-font registers this face as "MesloLGS Nerd Font".
[desktop.appearanceDarkChromeTheme]
accent = "#339cff"
contrast = 60
ink = "#F7F1FF"
opaqueWindows = false
surface = "#000000"

[desktop.appearanceDarkChromeTheme.fonts]
code = "MesloLGS Nerd Font"
ui = ""

[desktop.appearanceDarkChromeTheme.fonts.codeFace]
family = "MesloLGS Nerd Font"
fullName = "MesloLGS Nerd Font Regular"
postscriptName = "MesloLGSNF-Regular"

[desktop.appearanceDarkChromeTheme.semanticColors]
diffAdded = "#40c977"
diffRemoved = "#fa423e"
skill = "#ad7bf9"

[desktop.appearanceLightChromeTheme]
accent = "#0169cc"
contrast = 45
ink = "#0d0d0d"
opaqueWindows = false
surface = "#ffffff"

[desktop.appearanceLightChromeTheme.fonts]
code = "MesloLGS Nerd Font"
ui = ""

[desktop.appearanceLightChromeTheme.fonts.codeFace]
family = "MesloLGS Nerd Font"
fullName = "MesloLGS Nerd Font Regular"
postscriptName = "MesloLGSNF-Regular"

[desktop.appearanceLightChromeTheme.semanticColors]
diffAdded = "#00a240"
diffRemoved = "#e02e2a"
skill = "#751ed9"
